[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralpom"
version = "1.0.0"
description = "Differentiable ocean dynamics and staged neural correction"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24", "matplotlib>=3.7", "wandb>=0.19", "netCDF4>=1.6"]

[project.optional-dependencies]
test = ["pytest>=8", "timm>=1.0"]
ai = ["timm>=1.0"]
notebook = ["ipython>=8", "ipywidgets>=8"]

[project.urls]
Repository = "https://github.com/ChiyodaMomo01/NeuralPOM"

[project.scripts]
neuralpom = "neuralpom.v1.cli:main"
neuralpom-ai = "neuralpom.ai_baselines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neuralpom.cores.case_adapters" = ["README.md", "source_manifest.json", "data/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".venv"]
