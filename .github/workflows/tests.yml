name: Python tests

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'configs/**', 'pyproject.toml', '.github/workflows/tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'configs/**', 'pyproject.toml', '.github/workflows/tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
